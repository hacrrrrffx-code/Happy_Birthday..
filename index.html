<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Loading...</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fce4ec; /* Aapke theme se match karta hua light pink */
            font-family: 'Arial', sans-serif;
            color: #333;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        #timer {
            font-size: 4rem;
            font-weight: bold;
            color: #d81b60; /* Dark pink color */
        }
    </style>
</head>
<body>

    <h1>Surprise is opening in...</h1>
    <div id="timer">10</div>

    <script>
        // Yahan se seconds adjust kar sakte hain (abhi 10 sec hai)
        let timeLeft = 10; 
        const timerElement = document.getElementById("timer");

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                // Timer 0 hote hi purana project auto-open ho jayega
                window.location.href = "main.html"; 
            }
        }, 1000);
    </script>

</body>
</html>
