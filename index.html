<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Loading...</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            background-color: #fce4ec;
            font-family: 'Arial', sans-serif;
            color: #333;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #d81b60;
        }
        #timer {
            font-size: 4rem;
            font-weight: bold;
            color: #ad1457;
            background: #fff;
            padding: 15px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

        }
    </style>

</head>
<body>
    <h1>Surprise is opening in...</h1>
    <div id="timer">10</div>

    <script>
        // Yahan se seconds adjust kar sakte hain (abhi 10 sec hai)
        let timeLeft = 10; 
        const timerElement = document.getElementById("timer");

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                // Timer 0 hote hi purana project auto-open ho jayega
                window.location.href = "main.html"; 
            }
        }, 1000);
    </script>
</body>
</html>
